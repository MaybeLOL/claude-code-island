<svg xmlns="http://www.w3.org/2000/svg" width="320" height="68" viewBox="0 0 320 68">
  <defs>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Pill background -->
  <rect x="20" y="10" width="280" height="48" rx="24" fill="#161423" fill-opacity="0.95" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Ghost body -->
  <g transform="translate(38,18)">
    <rect x="4" y="0" width="4" height="2" fill="#d0c8f0"/>
    <rect x="2" y="2" width="8" height="2" fill="#d0c8f0"/>
    <rect x="0" y="4" width="12" height="2" fill="#b8aedd"/>
    <rect x="0" y="6" width="12" height="2" fill="#d0c8f0"/>
    <rect x="0" y="8" width="12" height="2" fill="#b8aedd"/>
    <rect x="0" y="10" width="12" height="2" fill="#6858a0"/>
    <rect x="0" y="12" width="12" height="2" fill="#6858a0"/>
    <rect x="0" y="14" width="4" height="2" fill="#6858a0" opacity="0.6"/>
    <rect x="4" y="14" width="4" height="2" fill="#6858a0" opacity="0.5"/>
    <rect x="8" y="14" width="4" height="2" fill="#6858a0" opacity="0.6"/>
    <!-- Sleeping eyes -->
    <rect x="2" y="7" width="3" height="1" fill="#6858a0"/>
    <rect x="7" y="7" width="3" height="1" fill="#6858a0"/>
    <rect x="4" y="10" width="4" height="1" fill="#6858a0" opacity="0.5"/>
  </g>
  <!-- Status dot -->
  <circle cx="72" cy="34" r="3" fill="#b8aedd">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Label -->
  <text x="84" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Idling...</text>
  <!-- CPU/MEM -->
  <text x="230" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#666666">12%</text>
  <text x="262" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#666666">8.2G</text>
</svg>
