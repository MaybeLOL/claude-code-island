<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Code Island</title>
<style>
  :root {
    --hi: #c8c0e0; --body: #b0a8d0; --shadow: #6858a0; --face: #6858a0;
    --bg-tint: rgba(30,30,30,0.72);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ios: cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .state-idle    { --hi:#c8c0e0;--body:#b0a8d0;--shadow:#6858a0;--face:#6858a0;--bg-tint:rgba(30,30,30,0.72); }
  .state-working { --hi:#f0c8a0;--body:#e0a878;--shadow:#c89068;--face:#5a3020;--bg-tint:rgba(35,28,22,0.72); }
  .state-success { --hi:#a0e8b8;--body:#78c890;--shadow:#58a870;--face:#1a5838;--bg-tint:rgba(22,32,26,0.72); }
  .state-error   { --hi:#e8b0b0;--body:#d08080;--shadow:#b06060;--face:#6a2020;--bg-tint:rgba(35,22,22,0.72); }

  /* Light theme overrides */
  .theme-light { --bg-tint:rgba(245,243,250,0.78); }
  .theme-light .pill {
    border-color:rgba(0,0,0,0.08);
    box-shadow:0 8px 32px rgba(0,0,0,0.12), inset 0 0.5px 0 rgba(255,255,255,0.5);
  }
  .theme-light .compact-label, .theme-light .exp-title { color:#111; }
  .theme-light .exp-sub, .theme-light .label, .theme-light .m-label { color:#666; }
  .theme-light .m-val, .theme-light .t-name, .theme-light .sess-path { color:#222; }
  .theme-light .m-track { background:rgba(0,0,0,0.06); }
  .theme-light .tasks-box { background:rgba(0,0,0,0.03); }
  .theme-light .sess-row { background:rgba(0,0,0,0.03); }
  .theme-light .sess-row:hover { background:rgba(0,0,0,0.05); }
  .theme-light .compact-meta { color:#999; }
  .theme-light .notif { background:rgba(245,243,250,0.95); color:#111; box-shadow:0 8px 24px rgba(0,0,0,0.1); }
  .theme-light .question-panel { background:rgba(0,0,0,0.03); }
  .theme-light .question-opt { background:rgba(0,0,0,0.03); border-color:rgba(0,0,0,0.06); }
  .theme-light .question-opt:hover { background:rgba(0,0,0,0.06); }
  .theme-light .question-opt-label { color:#111; }
  .theme-light .question-opt-desc { color:#666; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:transparent; overflow:hidden; user-select:none;
    font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased;
  }

  #island {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    transition:all 0.4s var(--spring); cursor:pointer;
  }
  .pill {
    background:var(--bg-tint);
    backdrop-filter:blur(60px); -webkit-backdrop-filter:blur(60px);
    border:1px solid rgba(255,255,255,0.15);
    overflow:hidden;
    transition:all 0.3s var(--spring);
    box-shadow:0 8px 32px rgba(0,0,0,0.3), inset 0 0.5px 0 rgba(255,255,255,0.12);
  }
  #island.compact .pill:hover { transform:scale(1.015); }

  /* Compact */
  #island.compact { width:240px; height:42px; }
  #island.compact .pill { height:42px; border-radius:21px; }
  .compact-view {
    display:flex; align-items:center; gap:8px;
    padding:0 12px 0 6px; height:42px;
  }
  .ghost-mini { width:28px; height:28px; flex-shrink:0; display:block; position:relative; top:3px; left:2px; }
  .ghost-big { width:40px; height:40px; flex-shrink:0; display:block; position:relative; top:2px; left:-3px; }
  .ghost-notif { width:20px; height:20px; display:block; }
  .ghost-wrap { width:28px; height:28px; flex-shrink:0; display:block; line-height:0; transition:opacity 0.15s ease; }
  .exp-top .ghost-wrap { width:40px; height:40px; }
  .status-dot {
    width:6px; height:6px; border-radius:50%; flex-shrink:0;
    background:var(--body); box-shadow:0 0 6px var(--body);
    animation:pulse 2.5s ease-in-out infinite;
    transition:background 0.4s ease, box-shadow 0.4s ease;
  }
  .status-dot.off { background:#555; box-shadow:none; animation:none; }
  .compact-label {
    font-size:12.5px; font-weight:500; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; flex:1;
    letter-spacing:-0.2px; transition:color 0.4s ease;
  }
  .compact-meta {
    display:flex; gap:6px; font-size:10px; color:#777;
    flex-shrink:0; font-weight:500; font-variant-numeric:tabular-nums;
  }

  /* Expanded */
  #island.expanded { width:320px; height:380px; }
  #island.expanded .pill { height:380px; border-radius:24px; }
  .expanded-view { display:none; flex-direction:column; padding:16px; height:100%; overflow:hidden; }
  #island.expanded .expanded-view { display:flex; }
  #island.expanded .compact-view { display:none; }

  .exp-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .exp-info { flex:1; }
  .exp-title { font-size:15px; font-weight:600; letter-spacing:-0.3px; }
  .exp-sub { font-size:11.5px; color:var(--body); font-weight:400; margin-top:2px; transition:color 0.4s ease; }
  .exp-x {
    width:24px; height:24px; border-radius:50%;
    background:rgba(255,255,255,0.04); display:flex;
    align-items:center; justify-content:center; cursor:pointer;
    transition:background 0.2s;
  }
  .exp-x:hover { background:rgba(255,255,255,0.1); }
  .exp-bell {
    width:24px; height:24px; border-radius:50%;
    background:rgba(255,255,255,0.04); display:flex;
    align-items:center; justify-content:center; cursor:pointer;
    transition:background 0.2s; position:relative;
  }
  .exp-bell:hover { background:rgba(255,255,255,0.1); }
  .bell-badge {
    position:absolute; top:0; right:0; width:8px; height:8px;
    border-radius:50%; background:#e08080;
  }
  .notif-history {
    display:none; position:absolute; top:52px; right:16px;
    width:260px; max-height:280px; z-index:100;
    background:rgba(30,30,30,0.95); backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.1); border-radius:14px;
    overflow:hidden; flex-direction:column;
  }
  .notif-history.open { display:flex; }
  .notif-history-list { flex:1; overflow-y:auto; padding:8px; }
  .notif-history-entry {
    display:flex; align-items:flex-start; gap:6px;
    padding:5px 7px; font-size:10.5px; border-radius:8px;
    border-left:2px solid #555;
  }
  .notif-history-entry.type-success { border-left-color:#70e090; }
  .notif-history-entry.type-info { border-left-color:#6ea8fe; }
  .notif-history-entry.type-question { border-left-color:#f0c060; }
  .notif-history-icon { flex-shrink:0; font-size:9px; margin-top:1px; }
  .notif-history-msg { flex:1; color:#ddd; font-weight:500; }
  .notif-history-time { font-size:9px; color:#555; flex-shrink:0; }
  .notif-history-clear {
    text-align:center; padding:7px; font-size:10.5px;
    color:#888; cursor:pointer; border-top:1px solid rgba(255,255,255,0.06);
    transition:color 0.2s;
  }
  .notif-history-clear:hover { color:#fff; }
  .theme-light .notif-history { background:rgba(245,243,250,0.95); border-color:rgba(0,0,0,0.06); }
  .theme-light .notif-history-msg { color:#333; }
  .theme-light .notif-history-clear { color:#666; border-top-color:rgba(0,0,0,0.06); }
  .theme-light .notif-history-clear:hover { color:#111; }

  .label {
    font-size:9px; color:#666; font-weight:600;
    text-transform:uppercase; letter-spacing:0.8px; margin-bottom:5px;
  }
  .meters { display:flex; gap:12px; margin-bottom:12px; }
  .m { flex:1; }
  .m-head { display:flex; justify-content:space-between; margin-bottom:4px; }
  .m-label { font-size:9px; color:#666; font-weight:600; }
  .m-val { font-size:10px; color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
  .m-track { height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
  .m-fill {
    height:100%; border-radius:2px; background:var(--body);
    transition:width 0.8s var(--ios), background 0.4s ease; width:0%;
  }

  .sess-list { margin-bottom:10px; }
  .sess-row {
    display:flex; align-items:center; gap:6px;
    padding:5px 10px; background:rgba(255,255,255,0.04);
    border-radius:10px; margin-bottom:3px; font-size:10.5px;
    cursor:pointer; transition:background 0.2s;
  }
  .sess-row:hover { background:rgba(255,255,255,0.06); }
  .sess-dot {
    width:5px; height:5px; border-radius:50%;
    background:var(--body); box-shadow:0 0 4px var(--body);
    transition:background 0.4s ease;
  }
  .sess-path { flex:1; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#ddd; }
  .sess-time { font-size:9px; color:#555; }
  .sess-task {
    font-size:9px; color:var(--body); font-weight:500;
    max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    flex-shrink:1;
  }

  .tasks-box {
    background:rgba(255,255,255,0.04); border-radius:10px;
    padding:6px 10px; font-size:11px; color:#888;
    flex:1; overflow-y:auto; min-height:36px;
  }
  .t-row { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .t-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .t-dot.pending { background:#555; }
  .t-dot.running { background:var(--body); box-shadow:0 0 4px var(--body); }
  .t-dot.done { background:#78c890; }
  .t-name { font-weight:500; color:#ddd; font-size:10.5px; }

  /* Tab bar */
  .tab-bar {
    display:flex; gap:0; margin-bottom:12px; position:relative;
  }
  .tab-btn {
    flex:1; padding:7px 0; text-align:center;
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.5px; color:#666; cursor:pointer;
    background:none; border:none; outline:none;
    transition:color 0.2s ease;
  }
  .tab-btn.active { color:#fff; }
  .tab-btn:hover:not(.active) { color:#999; }
  .tab-indicator {
    position:absolute; bottom:0; height:100%; width:0;
    background:rgba(255,255,255,0.08); border-radius:8px;
    transition:left 0.2s ease, width 0.2s ease;
  }
  .tab-content { display:none; flex:1; overflow:hidden; flex-direction:column; }
  .tab-content.active { display:flex; }
  .tab-content.fade-in { animation:tabFade 0.2s ease; }
  .theme-light .tab-btn { color:#999; }
  .theme-light .tab-btn.active { color:#111; }
  .theme-light .tab-indicator { background:rgba(0,0,0,0.06); }

  /* Activity tab */
  .activity-feed {
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px;
    padding:2px 0;
  }
  .activity-entry {
    display:flex; align-items:center; gap:6px;
    padding:3px 6px; font-size:10.5px; border-radius:8px;
  }
  .activity-entry:hover { background:rgba(255,255,255,0.03); }
  .activity-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .activity-dot.t-read { background:#6ea8fe; }
  .activity-dot.t-write { background:#70e090; }
  .activity-dot.t-bash { background:#f0a050; }
  .activity-dot.t-agent { background:#b8a0f0; }
  .activity-dot.t-other { background:#666; }
  .activity-label { flex:1; color:#ddd; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .activity-time { font-size:9px; color:#555; flex-shrink:0; }
  .activity-empty { text-align:center; color:#555; padding:30px 0; font-size:11px; }
  .theme-light .activity-entry:hover { background:rgba(0,0,0,0.03); }
  .theme-light .activity-label { color:#333; }
  .theme-light .activity-time { color:#888; }

  /* Settings tab */
  .settings-list { display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; padding:2px 0; }
  .setting-row {
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; color:#ddd;
  }
  .setting-label { font-weight:500; }
  .setting-control { display:flex; align-items:center; gap:6px; }
  .setting-slider {
    -webkit-appearance:none; width:90px; height:3px;
    background:rgba(255,255,255,0.08); border-radius:2px; outline:none;
  }
  .setting-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px;
    border-radius:50%; background:var(--body); cursor:pointer;
  }
  .setting-val { font-size:9px; color:#888; min-width:28px; text-align:right; }
  .setting-toggle {
    width:32px; height:18px; border-radius:9px;
    background:rgba(255,255,255,0.08); cursor:pointer;
    position:relative; transition:background 0.2s ease;
    border:none; outline:none; padding:0;
  }
  .setting-toggle.on { background:var(--body); }
  .setting-toggle::after {
    content:''; position:absolute; top:2px; left:2px;
    width:14px; height:14px; border-radius:50%;
    background:#fff; transition:left 0.2s ease;
  }
  .setting-toggle.on::after { left:16px; }
  .setting-btn {
    padding:5px 12px; border-radius:8px; font-size:10px;
    font-weight:600; cursor:pointer; border:none;
    background:rgba(255,255,255,0.06); color:#ddd;
    transition:background 0.2s ease;
  }
  .setting-btn:hover { background:rgba(255,255,255,0.12); }
  .setting-radio { display:flex; gap:4px; }
  .setting-radio-opt {
    padding:3px 8px; border-radius:6px; font-size:9.5px;
    font-weight:600; cursor:pointer; border:1px solid rgba(255,255,255,0.06);
    background:none; color:#888; transition:all 0.2s ease;
  }
  .setting-radio-opt.active { background:var(--body); color:#000; border-color:var(--body); }
  .theme-light .setting-row { color:#333; }
  .theme-light .setting-slider { background:rgba(0,0,0,0.08); }
  .theme-light .setting-btn { background:rgba(0,0,0,0.05); color:#333; }
  .theme-light .setting-btn:hover { background:rgba(0,0,0,0.08); }
  .theme-light .setting-toggle { background:rgba(0,0,0,0.08); }
  .theme-light .setting-radio-opt { border-color:rgba(0,0,0,0.08); color:#666; }
  .theme-light .setting-radio-opt.active { color:#000; }

  /* Stats row */
  .stats-row { display:flex; gap:12px; margin-bottom:12px; }
  .stat-item { flex:1; }
  .stat-label { font-size:9px; color:#666; font-weight:600; }
  .stat-val { font-size:12px; color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
  .theme-light .stat-val { color:#111; }

  /* Question panel */
  .question-panel {
    display:none; flex-direction:column; gap:6px;
    background:rgba(255,255,255,0.04); border-radius:12px;
    padding:10px; margin-bottom:8px;
  }
  .question-panel.active { display:flex; animation:qpulse 3s ease-in-out infinite; }
  .question-text {
    font-size:11.5px; font-weight:600; color:#fff;
    line-height:1.4; margin-bottom:3px;
  }
  .question-opt {
    padding:6px 10px; border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    cursor:pointer; transition:all 0.2s ease;
  }
  .question-opt:hover {
    background:rgba(255,255,255,0.08);
    border-color:color-mix(in srgb, var(--body) 40%, transparent);
  }
  .question-opt:active { transform:scale(0.97); }
  .question-opt-label { font-size:11.5px; font-weight:600; color:#fff; }
  .question-opt-desc { font-size:9.5px; color:#888; margin-top:2px; }
  .question-progress {
    font-size:9px; color:#888; font-weight:600; text-transform:uppercase;
    letter-spacing:0.5px; margin-bottom:4px;
  }
  .question-free-wrap {
    display:flex; gap:6px; margin-top:4px;
  }
  .question-free-input {
    flex:1; padding:6px 10px; border-radius:10px; font-size:11.5px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    color:#fff; outline:none; font-family:inherit;
  }
  .question-free-input:focus { border-color:var(--body); }
  .question-free-input::placeholder { color:#666; }
  .question-free-send {
    padding:6px 12px; border-radius:10px; font-size:11px; font-weight:600;
    background:var(--body); color:#000; border:none; cursor:pointer;
    transition:opacity 0.2s;
  }
  .question-free-send:hover { opacity:0.85; }
  .question-timeout-bar {
    height:2px; background:rgba(255,255,255,0.06); border-radius:1px;
    margin-top:6px; overflow:hidden;
  }
  .question-timeout-fill {
    height:100%; width:0%; border-radius:1px; background:var(--body);
    transition:width 1s linear, background 0.3s ease;
  }
  .theme-light .question-free-input {
    background:rgba(0,0,0,0.04); border-color:rgba(0,0,0,0.08); color:#111;
  }
  .theme-light .question-free-input::placeholder { color:#999; }

  /* Notification toast */
  .notif {
    position:fixed; left:50%; transform:translateX(-50%);
    background:rgba(30,30,30,0.92); backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    padding:8px 14px; display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:500; color:#fff;
    z-index:200; white-space:nowrap; cursor:pointer;
    transition:top 0.35s var(--spring), opacity 0.2s ease-out;
    opacity:0; top:-50px; pointer-events:none;
  }
  .notif.show { opacity:1; pointer-events:auto; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:transparent; border-radius:2px; }
  *:hover::-webkit-scrollbar-thumb { background:#444; }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2px);} }
  @keyframes bobFast { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2px);} }
  @keyframes ghostPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes ghostShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-1.5px);} 75%{transform:translateX(1.5px);} }
  @keyframes qpulse { 0%,100%{border-color:rgba(255,255,255,0.06);} 50%{border-color:rgba(255,255,255,0.15);} }
  @keyframes tabFade { from{opacity:0;} to{opacity:1;} }

  .pill-pulse { animation:pillPulse 1.5s ease-in-out infinite; }
  @keyframes pillPulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .state-idle .ghost-wrap { animation:bob 3s ease-in-out infinite; }
  .state-working .ghost-wrap { animation:bobFast 1.5s ease-in-out infinite; }
  .state-success .ghost-wrap { animation:ghostPulse 0.4s ease-out; }
  .state-error .ghost-wrap { animation:ghostShake 0.3s ease-in-out 2; }
</style>
</head>
<body>
<div id="island" class="compact state-idle">
  <div class="pill">
    <!-- COMPACT VIEW -->
    <div class="compact-view">
      <div class="ghost-wrap">
        <svg class="ghost-mini" id="ghostCompact" viewBox="0 0 32 32"></svg>
      </div>
      <div class="status-dot" id="statusDot"></div>
      <div class="compact-label" id="compactText">Idling...</div>
      <div class="compact-meta">
        <span id="cpuCompact">--</span>
        <span id="memCompact">--</span>
      </div>
    </div>

    <!-- EXPANDED VIEW -->
    <div class="expanded-view">
      <div class="exp-top">
        <div class="ghost-wrap">
          <svg class="ghost-big" id="ghostExp" viewBox="0 0 32 32"></svg>
        </div>
        <div class="exp-info">
          <div class="exp-title">Claude Code</div>
          <div class="exp-sub" id="expStatus">Ready</div>
        </div>
        <div class="exp-bell" id="bellBtn" title="Notifications">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="bell-badge" id="bellBadge" style="display:none;"></span>
        </div>
        <div class="exp-x" id="collapseBtn">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
               stroke="#666" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </div>
      </div>

      <!-- Notification history dropdown -->
      <div class="notif-history" id="notifHistory">
        <div class="notif-history-list" id="notifHistoryList"></div>
        <div class="notif-history-clear" id="notifClearAll">Clear all</div>
      </div>

      <div class="question-panel" id="questionPanel">
        <div class="question-progress" id="questionProgress" style="display:none;"></div>
        <div class="question-text" id="questionText"></div>
        <div id="questionOpts"></div>
        <div class="question-timeout-bar" id="questionTimeoutBar"><div class="question-timeout-fill" id="questionTimeoutFill"></div></div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="activity">Activity</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <!-- Dashboard tab -->
      <div class="tab-content active" id="tabDashboard" data-tab="dashboard">
        <div class="meters">
          <div class="m">
            <div class="m-head">
              <span class="m-label">CPU</span>
              <span class="m-val" id="cpuVal">--%</span>
            </div>
            <div class="m-track"><div class="m-fill" id="cpuBar"></div></div>
          </div>
          <div class="m">
            <div class="m-head">
              <span class="m-label">Memory</span>
              <span class="m-val" id="memVal">--%</span>
            </div>
            <div class="m-track"><div class="m-fill" id="memBar"></div></div>
          </div>
        </div>

        <div class="stats-row" id="statsRow">
          <div class="stat-item"><div class="stat-label">Duration</div><div class="stat-val" id="statDuration">--</div></div>
          <div class="stat-item"><div class="stat-label">Prompts</div><div class="stat-val" id="statPrompts">0</div></div>
          <div class="stat-item"><div class="stat-label">Tools</div><div class="stat-val" id="statTools">0</div></div>
        </div>

        <div class="label">Sessions</div>
        <div class="sess-list" id="sessionList"></div>

        <div class="label">Tasks</div>
        <div class="tasks-box" id="taskItems">No active tasks</div>
      </div>

      <!-- Activity tab -->
      <div class="tab-content" id="tabActivity" data-tab="activity">
        <div class="activity-feed" id="activityFeed">
          <div class="activity-empty">No activity yet</div>
        </div>
      </div>

      <!-- Settings tab -->
      <div class="tab-content" id="tabSettings" data-tab="settings">
        <div class="settings-list">
          <div class="setting-row">
            <span class="setting-label">Opacity</span>
            <div class="setting-control">
              <input type="range" class="setting-slider" id="opacitySlider" min="30" max="100" value="88">
              <span class="setting-val" id="opacityVal">88%</span>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-label">Polling</span>
            <div class="setting-control">
              <div class="setting-radio" id="pollingRadio">
                <button class="setting-radio-opt active" data-val="1000">Fast</button>
                <button class="setting-radio-opt" data-val="2000">Normal</button>
              </div>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-label">Notifications</span>
            <div class="setting-control">
              <div class="setting-radio" id="notifRadio">
                <button class="setting-radio-opt" data-val="inapp">In-app</button>
                <button class="setting-radio-opt" data-val="native">Native</button>
                <button class="setting-radio-opt active" data-val="both">Both</button>
              </div>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-label">Theme</span>
            <div class="setting-control">
              <button class="setting-toggle" id="themeToggle" title="Toggle light/dark"></button>
              <span class="setting-val" id="themeLabel">Dark</span>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-label">Answer Mode</span>
            <div class="setting-control">
              <div class="setting-radio" id="answerModeRadio">
                <button class="setting-radio-opt active" data-val="island">Island</button>
                <button class="setting-radio-opt" data-val="terminal">Terminal</button>
              </div>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-label">Position</span>
            <div class="setting-control">
              <button class="setting-btn" id="resetPosBtn">Reset to center</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PLACEHOLDER_SCRIPT -->
<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var island = $('island'), statusDot = $('statusDot'), compactText = $('compactText');
  var cpuCompact = $('cpuCompact'), memCompact = $('memCompact');
  var expStatus = $('expStatus');
  var cpuBar = $('cpuBar'), memBar = $('memBar'), cpuVal = $('cpuVal'), memVal = $('memVal');
  var collapseBtn = $('collapseBtn'), taskItems = $('taskItems');
  var sessionList = $('sessionList');

  var uiState = 'compact', ghostState = 'idle', running = false;
  var rendererSessionStart = null;
  var dragging = false, dragT = 0;
  var currentTab = 'dashboard';

  // Pill priority: 1=question, 2=tool, 3=task, 4=sessions, 5=idle
  var pillPriority = 5;
  var questionPending = false;

  function setPillText(text, priority) {
    if (priority <= pillPriority) {
      pillPriority = priority;
      compactText.textContent = text;
      compactText.classList.toggle('pill-pulse', priority === 1);
    }
  }

  function clearPillPriority(priority) {
    if (pillPriority === priority) {
      pillPriority = 5;
      compactText.classList.remove('pill-pulse');
      resetCompactLabel();
    }
  }

  // Tab switching
  var tabBtns = document.querySelectorAll('.tab-btn');
  var tabContents = document.querySelectorAll('.tab-content');
  var tabIndicator = $('tabIndicator');

  function updateTabIndicator() {
    var activeBtn = document.querySelector('.tab-btn.active');
    if (activeBtn && tabIndicator) {
      tabIndicator.style.left = activeBtn.offsetLeft + 'px';
      tabIndicator.style.width = activeBtn.offsetWidth + 'px';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    tabBtns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    tabContents.forEach(function(tc) {
      var isActive = tc.getAttribute('data-tab') === tab;
      tc.classList.toggle('active', isActive);
      if (isActive) {
        tc.classList.remove('fade-in');
        void tc.offsetWidth;
        tc.classList.add('fade-in');
      }
    });
    updateTabIndicator();
    if (tab === 'activity') {
      window.island.requestActivityLog();
      scrollActivityToBottom();
    }
  }

  tabBtns.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchTab(btn.getAttribute('data-tab'));
    });
  });

  setTimeout(updateTabIndicator, 100);

  // Activity feed
  var activityFeed = $('activityFeed');
  var activityEntries = [];

  function toolDotClass(tool) {
    if (!tool) return 't-other';
    if (['Read','Glob','Grep'].indexOf(tool) !== -1) return 't-read';
    if (['Write','Edit'].indexOf(tool) !== -1) return 't-write';
    if (tool === 'Bash') return 't-bash';
    if (tool === 'Agent') return 't-agent';
    return 't-other';
  }

  function renderActivityFeed() {
    if (activityEntries.length === 0) {
      activityFeed.innerHTML = '<div class="activity-empty">No activity yet</div>';
      return;
    }
    activityFeed.innerHTML = activityEntries.map(function(e) {
      var display = e.detail || e.label || e.tool || '...';
      return '<div class="activity-entry">' +
        '<span class="activity-dot ' + toolDotClass(e.tool) + '"></span>' +
        '<span class="activity-label">' + esc(display) + '</span>' +
        '<span class="activity-time">' + since(e.timestamp) + '</span>' +
        '</div>';
    }).join('');
  }

  function scrollActivityToBottom() {
    if (activityFeed) activityFeed.scrollTop = activityFeed.scrollHeight;
  }

  window.island.onActivityLog(function(data) {
    if (data.type === 'full') {
      activityEntries = data.entries || [];
    } else if (data.type === 'append' && data.entry) {
      activityEntries.push(data.entry);
      if (activityEntries.length > 100) activityEntries.shift();
    }
    if (currentTab === 'activity') {
      renderActivityFeed();
      scrollActivityToBottom();
    }
  });

  // Settings
  var currentSettings = { opacity: 0.88, pollingInterval: 1000, notifications: 'both', theme: 'dark', answerMode: 'island' };

  var opacitySlider = $('opacitySlider');
  var opacityVal2 = $('opacityVal');
  var pollingRadio = $('pollingRadio');
  var notifRadio = $('notifRadio');
  var answerModeRadio = $('answerModeRadio');
  var themeToggle = $('themeToggle');
  var themeLabel = $('themeLabel');
  var resetPosBtn = $('resetPosBtn');

  function applySettings(s) {
    currentSettings = s;
    if (opacitySlider) opacitySlider.value = Math.round(s.opacity * 100);
    if (opacityVal2) opacityVal2.textContent = Math.round(s.opacity * 100) + '%';
    if (pollingRadio) {
      pollingRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
        btn.classList.toggle('active', parseInt(btn.getAttribute('data-val')) === s.pollingInterval);
      });
    }
    if (notifRadio) {
      notifRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-val') === s.notifications);
      });
    }
    if (answerModeRadio) {
      answerModeRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-val') === (s.answerMode || 'island'));
      });
    }
    if (themeToggle) themeToggle.classList.toggle('on', s.theme === 'light');
    if (themeLabel) themeLabel.textContent = s.theme === 'light' ? 'Light' : 'Dark';
    document.body.classList.toggle('theme-light', s.theme === 'light');
    island.classList.toggle('theme-light', s.theme === 'light');
  }

  function saveSetting(key, value) {
    currentSettings[key] = value;
    window.island.saveSettings(currentSettings);
  }

  if (opacitySlider) {
    opacitySlider.addEventListener('input', function() {
      var val = parseInt(opacitySlider.value) / 100;
      if (opacityVal2) opacityVal2.textContent = opacitySlider.value + '%';
      window.island.setOpacity(val);
    });
    opacitySlider.addEventListener('change', function() {
      saveSetting('opacity', parseInt(opacitySlider.value) / 100);
    });
  }

  if (pollingRadio) {
    pollingRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = parseInt(btn.getAttribute('data-val'));
        pollingRadio.querySelectorAll('.setting-radio-opt').forEach(function(b) {
          b.classList.toggle('active', b === btn);
        });
        saveSetting('pollingInterval', val);
      });
    });
  }

  if (notifRadio) {
    notifRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = btn.getAttribute('data-val');
        notifRadio.querySelectorAll('.setting-radio-opt').forEach(function(b) {
          b.classList.toggle('active', b === btn);
        });
        saveSetting('notifications', val);
      });
    });
  }

  if (answerModeRadio) {
    answerModeRadio.querySelectorAll('.setting-radio-opt').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = btn.getAttribute('data-val');
        answerModeRadio.querySelectorAll('.setting-radio-opt').forEach(function(b) {
          b.classList.toggle('active', b === btn);
        });
        saveSetting('answerMode', val);
      });
    });
  }

  if (themeToggle) {
    themeToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var newTheme = currentSettings.theme === 'dark' ? 'light' : 'dark';
      themeToggle.classList.toggle('on', newTheme === 'light');
      if (themeLabel) themeLabel.textContent = newTheme === 'light' ? 'Light' : 'Dark';
      document.body.classList.toggle('theme-light', newTheme === 'light');
      island.classList.toggle('theme-light', newTheme === 'light');
      saveSetting('theme', newTheme);
    });
  }

  if (resetPosBtn) {
    resetPosBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      window.island.resetPosition();
    });
  }

  window.island.onSettingsLoaded(function(s) {
    applySettings(s);
  });
  window.island.requestSettings();

  // Notification history
  var bellBtn = $('bellBtn');
  var bellBadge = $('bellBadge');
  var notifHistoryEl = $('notifHistory');
  var notifHistoryList = $('notifHistoryList');
  var notifClearAll = $('notifClearAll');
  var notifHistoryData = [];
  var notifHistoryOpen = false;
  var unseenNotifs = 0;

  function renderNotifHistory() {
    if (notifHistoryData.length === 0) {
      notifHistoryList.innerHTML = '<div style="text-align:center;padding:20px;color:#555;font-size:11px;">No notifications</div>';
      return;
    }
    notifHistoryList.innerHTML = notifHistoryData.map(function(n) {
      var typeClass = 'type-' + (n.type || 'info');
      var icon = n.type === 'success' ? '&#10003;' : n.type === 'question' ? '?' : '&#8226;';
      return '<div class="notif-history-entry ' + typeClass + '">' +
        '<span class="notif-history-icon">' + icon + '</span>' +
        '<span class="notif-history-msg">' + esc(n.message) + '</span>' +
        '<span class="notif-history-time">' + since(n.timestamp) + '</span>' +
        '</div>';
    }).join('');
  }

  if (bellBtn) {
    bellBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      notifHistoryOpen = !notifHistoryOpen;
      notifHistoryEl.classList.toggle('open', notifHistoryOpen);
      if (notifHistoryOpen) {
        window.island.requestNotificationHistory();
        unseenNotifs = 0;
        if (bellBadge) bellBadge.style.display = 'none';
      }
    });
  }

  if (notifClearAll) {
    notifClearAll.addEventListener('click', function(e) {
      e.stopPropagation();
      notifHistoryData = [];
      renderNotifHistory();
      window.island.clearNotificationHistory();
    });
  }

  document.addEventListener('click', function(e) {
    if (notifHistoryOpen && !e.target.closest('.notif-history') && !e.target.closest('.exp-bell')) {
      notifHistoryOpen = false;
      notifHistoryEl.classList.remove('open');
    }
  });

  window.island.onNotificationHistory(function(data) {
    notifHistoryData = data || [];
    renderNotifHistory();
  });

  // Stats row
  var statDuration = $('statDuration');
  var statPrompts = $('statPrompts');
  var statTools = $('statTools');

  function updateStats(stats) {
    if (!stats) return;
    if (statDuration) {
      var d = stats.duration || 0;
      if (d < 60) statDuration.textContent = d + 's';
      else if (d < 3600) statDuration.textContent = Math.floor(d / 60) + 'm';
      else statDuration.textContent = Math.floor(d / 3600) + 'h ' + Math.floor((d % 3600) / 60) + 'm';
    }
    if (statPrompts) statPrompts.textContent = stats.promptCount || 0;
    if (statTools) {
      var total = 0;
      if (stats.toolCounts) {
        for (var k in stats.toolCounts) total += stats.toolCounts[k];
      }
      statTools.textContent = total;
    }
  }
  // --- GHOST LINE-ART ---
  var ghostPaths = {
    idle: {
      body: 'M10,18 Q10,20 12,20 L12,19 Q13,20 14,19 L14,20 Q15,20 16,18 Q16,20 18,20 L18,19 Q19,20 20,19 L20,20 Q22,20 22,18 L22,10 Q22,4 16,4 Q10,4 10,10 Z',
      face: [
        { type: 'circle', cx: 13, cy: 11, r: 1 },
        { type: 'circle', cx: 19, cy: 11, r: 1 },
        { type: 'path', d: 'M14,14.5 Q16,15.5 18,14.5' }
      ]
    },
    working: {
      body: 'M10,18 Q10,20 12,20 L12,19 Q13,20 14,19 L14,20 Q15,20 16,18 Q16,20 18,20 L18,19 Q19,20 20,19 L20,20 Q22,20 22,18 L22,10 Q22,4 16,4 Q10,4 10,10 Z',
      face: [
        { type: 'ellipse', cx: 13, cy: 10.5, rx: 1.5, ry: 2 },
        { type: 'circle', cx: 13, cy: 10.5, r: 0.6, fill: true },
        { type: 'ellipse', cx: 19, cy: 10.5, rx: 1.5, ry: 2 },
        { type: 'circle', cx: 19, cy: 10.5, r: 0.6, fill: true },
        { type: 'ellipse', cx: 16, cy: 15, rx: 1.2, ry: 1 }
      ]
    },
    success: {
      body: 'M10,18 Q10,20 12,20 L12,19 Q13,20 14,19 L14,20 Q15,20 16,18 Q16,20 18,20 L18,19 Q19,20 20,19 L20,20 Q22,20 22,18 L22,10 Q22,4 16,4 Q10,4 10,10 Z',
      face: [
        { type: 'path', d: 'M11.5,11 Q13,9.5 14.5,11' },
        { type: 'path', d: 'M17.5,11 Q19,9.5 20.5,11' },
        { type: 'path', d: 'M13,14 Q16,17 19,14' }
      ]
    },
    error: {
      body: 'M10,18 Q10,20 12,20 L12,19 Q13,20 14,19 L14,20 Q15,20 16,18 Q16,20 18,20 L18,19 Q19,20 20,19 L20,20 Q22,20 22,18 L22,10 Q22,4 16,4 Q10,4 10,10 Z',
      face: [
        { type: 'path', d: 'M11.5,9.5 L14.5,12.5' },
        { type: 'path', d: 'M14.5,9.5 L11.5,12.5' },
        { type: 'path', d: 'M17.5,9.5 L20.5,12.5' },
        { type: 'path', d: 'M20.5,9.5 L17.5,12.5' },
        { type: 'path', d: 'M14,15.5 Q16,14 18,15.5' }
      ]
    }
  };

  var stateStrokeColors = {
    idle: '#b0a8d0',
    working: '#e0a878',
    success: '#78c890',
    error: '#d08080'
  };

  function renderGhost(svgEl, gs) {
    var ghost = ghostPaths[gs];
    var stroke = stateStrokeColors[gs];
    var svg = '<path d="' + ghost.body + '" fill="none" stroke="' + stroke + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    ghost.face.forEach(function(f) {
      if (f.type === 'circle') {
        svg += '<circle cx="' + f.cx + '" cy="' + f.cy + '" r="' + f.r + '" fill="' + stroke + '" stroke="none"/>';
      } else if (f.type === 'ellipse') {
        if (f.fill) {
          svg += '<ellipse cx="' + f.cx + '" cy="' + f.cy + '" rx="' + f.rx + '" ry="' + f.ry + '" fill="' + stroke + '" stroke="none"/>';
        } else {
          svg += '<ellipse cx="' + f.cx + '" cy="' + f.cy + '" rx="' + f.rx + '" ry="' + f.ry + '" fill="none" stroke="' + stroke + '" stroke-width="1.5" stroke-linecap="round"/>';
        }
      } else if (f.type === 'path') {
        svg += '<path d="' + f.d + '" fill="none" stroke="' + stroke + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
      }
    });
    svgEl.innerHTML = svg;
  }

  function setGhostState(gs) {
    if (gs === ghostState) return;
    ghostState = gs;
    var wraps = document.querySelectorAll('.ghost-wrap');
    wraps.forEach(function(w) { w.style.opacity = '0'; });
    setTimeout(function() {
      island.className = island.className.replace(/state-\w+/,'state-'+gs);
      renderGhost($('ghostCompact'), gs);
      renderGhost($('ghostExp'), gs);
      wraps.forEach(function(w) { w.style.opacity = '1'; });
    }, 150);
  }

  // Initial render (no fade for first render)
  ghostState = 'idle';
  island.className = 'compact state-idle';
  renderGhost($('ghostCompact'), 'idle');
  renderGhost($('ghostExp'), 'idle');

  // --- DRAG ---
  island.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    if (e.target.closest('.setting-slider, .setting-toggle, .setting-btn, .setting-radio-opt, .tab-btn, .exp-bell, .question-opt, .question-free-input, .question-free-send')) return;
    dragging = false; dragT = Date.now();
    window.island.dragStart({x:e.screenX,y:e.screenY});
    function mv(ev){dragging=true;window.island.dragMove({x:ev.screenX,y:ev.screenY});}
    function up(){window.island.dragEnd();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });

  // --- UI STATE ---
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function setUI(s) {
    uiState = s;
    var theme = (typeof currentSettings !== 'undefined' && currentSettings.theme === 'light') ? ' theme-light' : '';
    island.className = s + ' state-' + ghostState + theme;
    window.island.resize(s);
  }
  island.addEventListener('click', function(e) {
    if (dragging && Date.now()-dragT>150) return;
    if (e.target.closest('.exp-x')) return;
    if (uiState==='compact') setUI('expanded');
  });
  collapseBtn.addEventListener('click', function(e){e.stopPropagation();setUI('compact');});
  document.addEventListener('keydown', function(e){if(e.key==='Escape'&&uiState!=='compact')setUI('compact');});

  // Toast stacking
  var toastStack = [];
  var MAX_TOASTS = 3;

  function notify(msg, type) {
    var message = typeof msg === 'object' ? msg.message : msg;
    type = (typeof msg === 'object' ? msg.type : type) || 'info';

    unseenNotifs++;
    if (bellBadge && !notifHistoryOpen) bellBadge.style.display = 'block';

    var toast = document.createElement('div');
    toast.className = 'notif show';
    toast.innerHTML = '<svg class="ghost-notif" viewBox="0 0 32 32"></svg><span>' + esc(message) + '</span>';
    renderGhost(toast.querySelector('svg'), ghostState);
    document.body.appendChild(toast);

    toastStack.push(toast);
    if (toastStack.length > MAX_TOASTS) {
      var old = toastStack.shift();
      old.remove();
    }
    repositionToasts();

    toast.addEventListener('click', function() {
      dismissToast(toast);
    });

    setTimeout(function() {
      dismissToast(toast);
    }, 4000);
  }

  function dismissToast(toast) {
    if (toast._dismissed) return;
    toast._dismissed = true;
    toast.classList.remove('show');
    setTimeout(function() {
      var idx = toastStack.indexOf(toast);
      if (idx !== -1) toastStack.splice(idx, 1);
      toast.remove();
      repositionToasts();
    }, 300);
  }

  function repositionToasts() {
    for (var i = 0; i < toastStack.length; i++) {
      toastStack[i].style.top = (48 + i * 40) + 'px';
    }
  }

  // --- IPC HANDLERS ---
  window.island.onSystemInfo(function(d) {
    cpuCompact.textContent = d.cpu+'%';
    if (running && rendererSessionStart) {
      var elapsed = Math.floor((Date.now() - rendererSessionStart) / 1000);
      var uptimeStr;
      if (elapsed < 60) uptimeStr = '0m';
      else if (elapsed < 3600) uptimeStr = Math.floor(elapsed / 60) + 'm';
      else if (elapsed < 86400) uptimeStr = Math.floor(elapsed / 3600) + 'h ' + Math.floor((elapsed % 3600) / 60) + 'm';
      else uptimeStr = Math.floor(elapsed / 86400) + 'd';
      memCompact.textContent = uptimeStr;
    } else {
      memCompact.textContent = d.memUsed+'G';
    }
    cpuBar.style.width = d.cpu+'%';
    memBar.style.width = d.memPercent+'%';
    cpuVal.textContent = d.cpu+'%';
    memVal.textContent = d.memUsed+'/'+d.memTotal+'G';
  });

  window.island.onClaudeStatus(function(d) {
    var was = running; running = d.running;
    if (!was && running) rendererSessionStart = Date.now();
    if (was && !running) rendererSessionStart = null;
    statusDot.className = 'status-dot'+(running?'':' off');

    if (running) {
      var n = d.sessions?d.sessions.length:0;
      expStatus.textContent = n+' session'+(n>1?'s':'')+' running';
    } else {
      expStatus.textContent = 'No active sessions';
    }

    if (d.sessions && d.sessions.length>0) {
      sessionList.innerHTML = d.sessions.map(function(s) {
        var dir = s.cwd?s.cwd.split(/[\\/]/).slice(-2).join('/'):'?';
        var label = dir;
        var sameCwd = d.sessions.filter(function(o){return o.cwd===s.cwd;});
        if (sameCwd.length > 1 && s.sessionId) {
          label = dir + ' #' + s.sessionId.substring(0,6);
        }
        var activeTask = '';
        if (d.tasks) {
          var inProg = d.tasks.find(function(t) { return t.status === 'in_progress'; });
          if (inProg) activeTask = inProg.subject || inProg.name || '';
        }
        var ago = s.startedAt?since(s.startedAt):'';
        var taskHtml = activeTask ? '<span class="sess-task">'+esc(activeTask)+'</span>' : '';
        return '<div class="sess-row" onclick="window.island.jumpToTerminal('+s.pid+')"><span class="sess-dot"></span><span class="sess-path">'+esc(label)+'</span>'+taskHtml+'<span class="sess-time">'+ago+'</span></div>';
      }).join('');
    } else { sessionList.innerHTML=''; }

    if (d.tasks && d.tasks.length>0) {
      taskItems.innerHTML = d.tasks.map(function(t) {
        var c = t.status==='completed'?'done':t.status==='in_progress'?'running':'pending';
        return '<div class="t-row"><span class="t-dot '+c+'"></span><span class="t-name">'+esc(t.subject||t.name||'Task')+'</span></div>';
      }).join('');
    } else { taskItems.innerHTML='No active tasks'; }
    if (d.stats) updateStats(d.stats);

    if (!was && running) { notify('Session started'); }
    else if (was && !running) { notify('Session ended'); }

    // Update compact pill idle text based on session count
    if (running && pillPriority >= 4) {
      var sc = d.sessions ? d.sessions.length : 0;
      setPillText(sc + ' session' + (sc > 1 ? 's' : '') + ' active', 4);
    }
    if (!running && pillPriority >= 5) {
      setPillText('Idling...', 5);
    }
  });

  window.island.onGhostState(function(gs) {
    setGhostState(gs);
    // Sync compact label with ghost state
    if (gs === 'idle') {
      resetCompactLabel();
    }
  });

  var lastToolStatusTime = 0;

  window.island.onToolStatus(function(s) {
    // Deduplicate fs.watch double-fires on Windows
    if (s.timestamp && s.timestamp === lastToolStatusTime) return;
    lastToolStatusTime = s.timestamp || 0;

    if (s.label) {
      if (!questionPending) {
        setPillText(s.label, 2);
      }
      if (s.needsInput) {
        questionPending = true;
        var qLabel = s.detail ? '? ' + s.detail : '? Needs input';
        setPillText(qLabel, 1);
      }
    }
    if (!s.needsInput && !answerPending && qPanel.classList.contains('active')) {
      hideQuestion();
    }
  });

  // Question panel
  var qPanel = $('questionPanel'), qText = $('questionText'), qOpts = $('questionOpts');
  var currentSessionId = null;
  var multiSelected = [];
  var allQuestions = [];
  var currentQuestionIndex = 0;
  var collectedAnswers = {};
  var collectedCustomText = {};
  var questionStartTime = null;
  var timeoutInterval = null;

  function showQuestion(q) {
    allQuestions = q.allQuestions || [q];
    currentQuestionIndex = 0;
    collectedAnswers = {};
    collectedCustomText = {};
    currentSessionId = q.session_id || null;
    answerPending = false;
    questionPending = true;
    pillPriority = 1;
    questionStartTime = Date.now();
    renderCurrentQuestion();
    startTimeoutBar();
    qPanel.classList.add('active');
    if (uiState === 'compact') setUI('expanded');
  }

  function renderCurrentQuestion() {
    var q = allQuestions[currentQuestionIndex];
    var progress = $('questionProgress');
    if (allQuestions.length > 1) {
      progress.textContent = 'Question ' + (currentQuestionIndex + 1) + ' of ' + allQuestions.length;
      progress.style.display = 'block';
    } else {
      progress.style.display = 'none';
    }
    multiSelected = [];
    qText.textContent = q.question;

    if (q.multiSelect) {
      qOpts.innerHTML = q.options.map(function(o, i) {
        return '<div class="question-opt" data-idx="'+i+'" onclick="window._toggleOption('+i+')">' +
          '<div class="question-opt-label"><span class="q-check" id="qc'+i+'">[ ]</span> '+esc(o.label)+'</div>' +
          (o.description ? '<div class="question-opt-desc">'+esc(o.description)+'</div>' : '') +
          '</div>';
      }).join('') + '<div class="question-opt" onclick="window._submitMulti()" style="text-align:center;margin-top:6px;background:var(--body);border-color:var(--body);">' +
        '<div class="question-opt-label" style="color:#000;">Confirm</div></div>';
    } else {
      qOpts.innerHTML = q.options.map(function(o, i) {
        return '<div class="question-opt" data-idx="'+i+'" onclick="window._pickOption('+i+')">' +
          '<div class="question-opt-label">'+(i+1)+'. '+esc(o.label)+'</div>' +
          (o.description ? '<div class="question-opt-desc">'+esc(o.description)+'</div>' : '') +
          '</div>';
      }).join('') +
      '<div class="question-opt" onclick="window._showFreeText()">' +
        '<div class="question-opt-label" style="color:#888;">Other...</div></div>';
    }
  }

  function hideQuestion() {
    qPanel.classList.remove('active');
    qOpts.innerHTML = '';
    allQuestions = [];
    currentQuestionIndex = 0;
    currentSessionId = null;
    multiSelected = [];
    collectedAnswers = {};
    collectedCustomText = {};
    stopTimeoutBar();
    var fill = $('questionTimeoutFill');
    if (fill) fill.style.width = '0%';
  }

  var answerPending = false;

  window._toggleOption = function(idx) {
    if (answerPending) return;
    var pos = multiSelected.indexOf(idx);
    if (pos === -1) { multiSelected.push(idx); } else { multiSelected.splice(pos, 1); }
    var check = document.getElementById('qc'+idx);
    if (check) check.textContent = pos === -1 ? '[x]' : '[ ]';
    var opt = qPanel.querySelectorAll('.question-opt')[idx];
    if (opt) opt.style.background = pos === -1 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)';
  };

  window._showFreeText = function() {
    if (answerPending) return;
    qOpts.innerHTML = '<div class="question-free-wrap">' +
      '<input class="question-free-input" id="freeTextInput" placeholder="Type your answer..." autofocus />' +
      '<button class="question-free-send" onclick="window._submitFreeText()">Send</button>' +
      '</div>';
    var inp = $('freeTextInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') window._submitFreeText();
      });
    }
  };

  window._submitFreeText = function() {
    if (answerPending) return;
    var inp = $('freeTextInput');
    var text = inp ? inp.value.trim() : '';
    if (!text) return;
    collectedCustomText[currentQuestionIndex] = text;
    collectedAnswers[currentQuestionIndex] = 0;
    advanceOrSubmit();
  };

  function advanceOrSubmit() {
    currentQuestionIndex++;
    if (currentQuestionIndex < allQuestions.length) {
      renderCurrentQuestion();
      return;
    }
    answerPending = true;
    qText.textContent = 'Sending answer...';
    qOpts.innerHTML = '';
    stopTimeoutBar();

    var response = { session_id: currentSessionId, answers: collectedAnswers };
    if (Object.keys(collectedCustomText).length > 0) {
      response.customText = collectedCustomText;
    }
    window.island.answerQuestion(response);

    var labels = [];
    for (var k in collectedAnswers) {
      if (collectedCustomText[k]) {
        labels.push('"' + collectedCustomText[k].substring(0, 20) + '"');
      } else {
        var qi = parseInt(k);
        var ai = collectedAnswers[k];
        var q = allQuestions[qi];
        if (q && q.options[ai]) labels.push(q.options[ai].label);
      }
    }
    notify('Answered: ' + labels.join(', '));

    setTimeout(function() { qText.textContent = 'Answer sent \u2713'; }, 800);
    setTimeout(function() {
      hideQuestion();
      answerPending = false;
      questionPending = false;
      clearPillPriority(1);
    }, 2000);
  }

  function startTimeoutBar() {
    var fill = $('questionTimeoutFill');
    if (!fill) return;
    fill.style.width = '0%';
    fill.style.background = 'var(--body)';
    clearInterval(timeoutInterval);
    questionStartTime = Date.now();
    timeoutInterval = setInterval(function() {
      var elapsed = (Date.now() - questionStartTime) / 1000;
      var pct = Math.min((elapsed / 120) * 100, 100);
      fill.style.width = pct + '%';
      if (elapsed >= 110) fill.style.background = '#d08080';
      else if (elapsed >= 100) fill.style.background = '#e0a878';
      if (elapsed >= 120) {
        stopTimeoutBar();
        qText.textContent = 'Timed out';
        setTimeout(function() {
          hideQuestion();
          questionPending = false;
          clearPillPriority(1);
        }, 1500);
      }
    }, 1000);
  }

  function stopTimeoutBar() {
    clearInterval(timeoutInterval);
    timeoutInterval = null;
  }

  window._submitMulti = function() {
    if (answerPending || multiSelected.length === 0) return;
    collectedAnswers[currentQuestionIndex] = multiSelected.slice();
    setTimeout(function() { advanceOrSubmit(); }, 400);
  };

  window._pickOption = function(idx) {
    if (answerPending) return;
    var opts = qPanel.querySelectorAll('.question-opt');
    for (var i = 0; i < opts.length; i++) {
      if (i === idx) {
        opts[i].style.background = 'var(--body)';
        opts[i].style.borderColor = 'var(--body)';
        opts[i].querySelector('.question-opt-label').style.color = '#000';
        if (opts[i].querySelector('.question-opt-desc'))
          opts[i].querySelector('.question-opt-desc').style.color = '#333';
      } else {
        opts[i].style.opacity = '0.3';
        opts[i].style.pointerEvents = 'none';
      }
    }
    collectedAnswers[currentQuestionIndex] = idx;
    setTimeout(function() { advanceOrSubmit(); }, 400);
  };

  window.island.onShowQuestion(function(q) {
    showQuestion(q);
  });

  var compactResetTimer = null;

  function resetCompactLabel() {
    if (pillPriority >= 4) {
      if (running) {
        pillPriority = 5;
      } else {
        pillPriority = 5;
        compactText.textContent = 'Idling...';
        compactText.classList.remove('pill-pulse');
      }
    }
  }

  window.island.onNewPrompt(function(e) {
    var display = e.display?e.display.substring(0,40):'...';
    if (running && !questionPending) {
      setPillText(display, 3);
      clearTimeout(compactResetTimer);
      compactResetTimer = setTimeout(function() { clearPillPriority(3); }, 5000);
    }
  });

  window.island.onToast(function(msg) { notify(msg); });
  window.island.onTaskStarted(function(msg) {
    notify('Working: ' + msg);
    if (!questionPending) {
      setPillText('Working: ' + msg, 3);
    }
    clearTimeout(compactResetTimer);
    compactResetTimer = setTimeout(function() { clearPillPriority(3); }, 3000);
  });

  function since(ts) {
    var s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s';
    var m=Math.floor(s/60);if(m<60)return m+'m';
    var h=Math.floor(m/60);if(h<24)return h+'h';
    return Math.floor(h/24)+'d';
  }
})();
</script>
</body>
</html>
